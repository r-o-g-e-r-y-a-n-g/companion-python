<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff" />
  
  <!-- Back Hair -->
  <path d="M 120 180 Q 80 260 90 350 Q 200 370 310 350 Q 320 260 280 180 Z" fill="#1c1917" />
  
  <!-- Neck and Shoulders -->
  <path d="M 185 240 L 185 295 L 215 295 L 215 240 Z" fill="#fed7aa" />
  <!-- Neck Shadow -->
  <path d="M 185 240 Q 200 252 215 240 L 215 248 Q 200 260 185 248 Z" fill="#fdba74" opacity="0.8" />
  
  <!-- Clothes / Collar -->
  <path d="M 140 320 Q 200 345 260 320 L 280 400 L 120 400 Z" fill="#1e293b" />
  <path d="M 185 295 L 200 330 L 215 295 Z" fill="#ffffff" />
  <!-- Cute Red Ribbon -->
  <path d="M 194 326 H 206 L 200 334 Z" fill="#ef4444" />
  <path d="M 200 334 L 182 365 Q 200 355 218 365 Z" fill="#ef4444" />
  
  <!-- Cat Ears -->
  <!-- Left Ear -->
  <path d="M 145 125 C 130 85 110 65 90 60 C 102 98 120 122 140 132 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" />
  <path d="M 138 120 C 126 92 114 78 100 74 C 108 98 120 116 132 122 Z" fill="#fda4af" />
  <!-- Right Ear -->
  <path d="M 255 125 C 270 85 290 65 310 60 C 298 98 280 122 260 132 Z" fill="#1c1917" stroke="#1c1917" stroke-width="2" />
  <path d="M 262 120 C 274 92 286 78 300 74 C 292 98 280 116 268 122 Z" fill="#fda4af" />

  <!-- Base Head / Face -->
  <path d="M 140 180 Q 140 260 200 280 Q 260 260 260 180 Q 260 120 200 120 Q 140 120 140 180 Z" fill="#ffedd5" />
  
  <!-- Hair Highlights/Shine -->
  <path d="M 155 125 Q 200 115 245 125" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35" stroke-dasharray="14, 8, 4, 8" />

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="170" cy="205" rx="16" ry="11" fill="#ffffff" stroke="#1c1917" stroke-width="2" />
  <ellipse cx="170" cy="205" rx="11" ry="10" fill="#06b6d4" />
  <ellipse cx="170" cy="205" rx="6" ry="6" fill="#1c1917" />
  <circle cx="166" cy="200" r="3.2" fill="#ffffff" />
  <circle cx="174" cy="210" r="2" fill="#ffffff" opacity="0.8" />
  <!-- Right Eye -->
  <ellipse cx="230" cy="205" rx="16" ry="11" fill="#ffffff" stroke="#1c1917" stroke-width="2" />
  <ellipse cx="230" cy="205" rx="11" ry="10" fill="#06b6d4" />
  <ellipse cx="230" cy="205" rx="6" ry="6" fill="#1c1917" />
  <circle cx="226" cy="200" r="3.2" fill="#ffffff" />
  <circle cx="234" cy="210" r="2" fill="#ffffff" opacity="0.8" />
  
  <!-- Eyelashes / Eyelids (Thick and Crisply Styled) -->
  <path d="M 150 205 Q 170 191 190 205" fill="none" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 210 205 Q 230 191 250 205" fill="none" stroke="#1c1917" stroke-width="4.5" stroke-linecap="round" />
  <!-- Double Fold Eyelid -->
  <path d="M 153 194 Q 170 186 187 194" fill="none" stroke="#1c1917" stroke-width="1.5" opacity="0.6" />
  <path d="M 213 194 Q 230 186 247 194" fill="none" stroke="#1c1917" stroke-width="1.5" opacity="0.6" />

  <!-- Eyebrows -->
  <path d="M 151 184 Q 170 174 186 184" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 214 184 Q 230 174 249 184" fill="none" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />

  <!-- Blushing Cheeks -->
  <ellipse cx="162" cy="226" rx="16" ry="7" fill="#f87171" opacity="0.4" />
  <ellipse cx="238" cy="226" rx="16" ry="7" fill="#f87171" opacity="0.4" />
  
  <!-- Nose (Cute & Small/Minimalist Point) -->
  <path d="M 200 220 L 198 223 Q 200 224 202 223 Z" fill="#da8f70" stroke="#da8f70" stroke-width="1.2" />

  <!-- Front Hair bangs -->
  <path d="M 135 120 C 135 120 120 180 125 280 C 127 315 136 335 136 335 L 146 335 C 143 310 140 220 152 170 Z" fill="#1c1917" />
  <path d="M 265 120 C 265 120 280 180 275 280 C 273 315 264 335 264 335 L 254 335 C 257 310 260 220 248 170 Z" fill="#1c1917" />
  
  <path d="M 135 125 Q 165 175 172 190 Q 174 190 178 165" fill="#1c1917" />
  <path d="M 165 125 Q 192 188 196 198 Q 198 198 202 168" fill="#1c1917" />
  <path d="M 195 125 Q 200 185 204 194 Q 206 194 220 145" fill="#1c1917" />
  <path d="M 215 125 Q 232 180 238 185 Q 240 185 255 130" fill="#1c1917" />
  
  <!-- Outer Hair Frame -->
  <path d="M 138 180 C 130 90 270 90 262 180 Z" fill="#1c1917" opacity="0.1" /> <!-- soft shadow -->
  <path d="M 138 180 C 134 100 266 100 262 180 Z" fill="#1c1917" />

  <!-- Active Lip Sync Mouth State: OPEN (Phonetic "A") -->
  <g id="mouth-open">
    <path d="M 186 244 Q 200 272 214 244 C 208 238 192 238 186 244 Z" fill="#991b1b" stroke="#1c1917" stroke-width="3" stroke-linejoin="round" />
    <path d="M 191 254 Q 200 268 209 254 Q 200 261 191 254" fill="#fda4af" />
    <!-- White teeth shine top -->
    <path d="M 188 244.5 Q 200 248 212 244.5 C 204 243.5 196 243.5 188 244.5 Z" fill="#ffffff" />
  </g>
</svg>
